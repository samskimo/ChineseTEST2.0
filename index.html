<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國文科雲端測驗與診斷系統</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary-color: #c92a2a;
      --primary-hover: #a61e1e;
      --bg-color: #fcf8f2;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      padding: 24px;
      box-sizing: border-box;
    }

    /* 頁面切換控制 */
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* 通用按鈕 */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background-color: var(--primary-color);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .btn:hover { background-color: var(--primary-hover); }
    .btn-secondary {
      background-color: #e9ecef;
      color: #495057;
    }
    .btn-secondary:hover { background-color: #dee2e6; }

    /* 登入頁樣式 */
    .login-header { text-align: center; margin-bottom: 20px; }
    .login-icon {
      width: 60px; height: 60px; background: #fff3f3;
      color: var(--primary-color); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 10px; font-size: 28px; border: 2px solid var(--primary-color);
    }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; margin-bottom: 6px; font-weight: bold; }
    .input-group input, .input-group select {
      width: 100%; padding: 12px; border: 1px solid #ced4da;
      border-radius: 8px; box-sizing: border-box; font-size: 15px;
    }

    /* 測驗進行頁樣式 */
    .quiz-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee;
    }
    .progress-bar-bg {
      width: 100%; height: 8px; background: #e9ecef; border-radius: 4px; overflow: hidden; margin-bottom: 20px;
    }
    .progress-bar-fill { height: 100%; background: var(--primary-color); width: 0%; transition: width 0.3s; }

    /* 雙欄閱讀版面 */
    .quiz-layout { display: flex; gap: 20px; flex-wrap: wrap; }
    .passage-box {
      flex: 1; min-width: 280px; background: #f8f9fa; border: 1px solid #e9ecef;
      padding: 15px; border-radius: 10px; max-height: 350px; overflow-y: auto; font-size: 15px; line-height: 1.6;
    }
    .question-box { flex: 1; min-width: 280px; }
    .question-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
    
    .option-card {
      border: 1.5px solid #e9ecef; border-radius: 10px; padding: 12px 16px;
      margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px;
      transition: all 0.2s;
    }
    .option-card:hover { border-color: var(--primary-color); background-color: #fff3f3; }
    .option-card.selected { border-color: var(--primary-color); background-color: var(--primary-color); color: #fff; }
    .option-key {
      width: 28px; height: 28px; border-radius: 50%; background: #e9ecef;
      display: flex; align-items: center; justify-content: center; font-weight: bold; color: #495057;
    }
    .option-card.selected .option-key { background: #fff; color: var(--primary-color); }

    /* 結算頁樣式 */
    .score-card {
      text-align: center; background: var(--primary-color); color: #fff;
      padding: 30px; border-radius: var(--border-radius); margin-bottom: 20px;
    }
    .score-num { font-size: 64px; font-weight: 900; margin: 10px 0; }
    .badge-title { background: rgba(255,255,255,0.2); display: inline-block; padding: 6px 16px; border-radius: 20px; }

    .chart-container { position: relative; max-width: 400px; margin: 0 auto 20px; }
    .insight-box { background: #fff5f5; border-left: 4px solid var(--primary-color); padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 20px; }

    /* 歷次紀錄列表 */
    .history-item { border-bottom: 1px solid #eee; padding: 12px 0; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <div class="container">

    <!-- 1. 登入視圖 -->
    <div id="view-login" class="view-section active">
      <div class="login-header">
        <div class="login-icon">📖</div>
        <h2 style="margin: 5px 0;">國文科雲端測驗</h2>
        <p style="color: #6c757d; font-size: 14px; margin: 0;">一期一會，全力以赴的智慧挑戰</p>
      </div>

      <div class="input-group">
        <label>選擇測驗單元</label>
        <select id="select-quiz">
          <option value="QUIZ_01">QUIZ_01 - 生活美學的起點</option>
        </select>
      </div>

      <div class="input-group">
        <label>班級</label>
        <select id="input-class">
          <option value="101">101 班</option>
          <option value="102">102 班</option>
          <option value="103">103 班</option>
        </select>
      </div>

      <div class="input-group">
        <label>座號</label>
        <input type="number" id="input-seat" placeholder="請輸入座號 (如: 05)">
      </div>

      <div class="input-group">
        <label>姓名</label>
        <input type="text" id="input-name" placeholder="請輸入姓名">
      </div>

      <div class="input-group">
        <label>Email (用於接收訂正報告)</label>
        <input type="email" id="input-email" placeholder="example@school.edu.tw">
      </div>

      <button class="btn" onclick="startQuiz()">參上！開始測驗 ></button>
      <button class="btn btn-secondary" onclick="fetchHistory()">📜 查詢歷次成績</button>
    </div>


    <!-- 2. 測驗視圖 -->
    <div id="view-quiz" class="view-section">
      <div class="quiz-header">
        <span id="quiz-title-tag" style="background: #fff3f3; color: var(--primary-color); padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 14px;">測驗中</span>
        <span id="progress-text" style="font-weight: bold;">1 / 10</span>
      </div>

      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>

      <div class="quiz-layout">
        <!-- 左側閱讀文本 (有文本時自動顯示) -->
        <div id="passage-container" class="passage-box" style="display: none;"></div>

        <!-- 右側題目區 -->
        <div class="question-box">
          <div id="question-text" class="question-title">題目載入中...</div>
          <div id="options-container"></div>
          
          <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button id="btn-prev" class="btn btn-secondary" style="flex: 1;" onclick="prevQuestion()">上一題</button>
            <button id="btn-next" class="btn" style="flex: 1;" onclick="nextQuestion()">下一題</button>
          </div>
        </div>
      </div>
    </div>


    <!-- 3. 結算與診斷視圖 -->
    <div id="view-result" class="view-section">
      <div class="score-card">
        <div style="font-size: 14px; letter-spacing: 1px;">FINAL SCORE RESULT</div>
        <div id="result-score" class="score-num">0</div>
        <div id="result-badge" class="badge-title">【國文小達人】</div>
      </div>

      <h3 style="text-align: center; color: var(--primary-color);">📊 個人國文能力診斷</h3>
      <div class="chart-container">
        <canvas id="radarChart"></canvas>
      </div>

      <div id="ai-insight" class="insight-box">
        正在分析您的答題弱點...
      </div>

      <button class="btn" onclick="location.reload()">🔄 重新測驗</button>
    </div>


    <!-- 4. 歷次紀錄視圖 -->
    <div id="view-history" class="view-section">
      <h3>📜 個人學習歷程與紀錄</h3>
      <div id="history-list">資料載入中...</div>
      <button class="btn btn-secondary" style="margin-top: 20px;" onclick="showView('view-login')">返回首頁</button>
    </div>

  </div>

  <script>
    // 你的 GAS 部署網址
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwSmAD0BRWtfrzN-JVelWZqGK518OSeT5WVAWqZC12-YBfIf6BYDCDk_X44b3tse5Ex/exec";

    // 系統狀態變數
    let currentQuizData = [];
    let currentQuestionIndex = 0;
    let userAnswers = {};
    let userInfo = {};
    let radarChartInstance = null;

    // 視圖切換
    function showView(viewId) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    // 開始測驗
    async function startQuiz() {
      const className = document.getElementById('input-class').value;
      const seat = document.getElementById('input-seat').value;
      const name = document.getElementById('input-name').value;
      const quizId = document.getElementById('select-quiz').value;

      if (!seat || !name) {
        alert('請填寫座號與姓名！');
        return;
      }

      userInfo = {
        userId: `${className}_${seat}`,
        userName: name,
        email: document.getElementById('input-email').value,
        quizId: quizId
      };

      // 從 GAS 抓取題目
      try {
        const response = await fetch(`${GAS_API_URL}?action=getQuiz&quiz_id=${quizId}`);
        const result = await response.json();

        if (result.status === 'success' && result.data.length > 0) {
          currentQuizData = result.data;
          currentQuestionIndex = 0;
          userAnswers = {};
          renderQuestion();
          showView('view-quiz');
        } else {
          alert('找不到該單元的題目資料，請檢查題庫！');
        }
      } catch (e) {
        alert('載入題目失敗，請確認網路連線或 GAS 部署！');
      }
    }

    // 渲染單一題目
    function renderQuestion() {
      const q = currentQuizData[currentQuestionIndex];
      const total = currentQuizData.length;

      // 更新進度條
      document.getElementById('progress-text').innerText = `${currentQuestionIndex + 1} / ${total}`;
      document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / total) * 100}%`;

      // 檢查是否有文章文本 (雙欄 layout)
      const passageBox = document.getElementById('passage-container');
      if (q.passage && q.passage.trim() !== "") {
        passageBox.innerHTML = `<strong>【閱讀文本】</strong><br>${q.passage}`;
        passageBox.style.display = 'block';
      } else {
        passageBox.style.display = 'none';
      }

      // 渲染題目與選項
      document.getElementById('question-text').innerText = `第 ${currentQuestionIndex + 1} 題．${q.question}`;
      
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach(opt => {
        const card = document.createElement('div');
        card.className = `option-card ${userAnswers[q.id] === opt.key ? 'selected' : ''}`;
        card.onclick = () => selectOption(q.id, opt.key);

        card.innerHTML = `
          <div class="option-key">${opt.key}</div>
          <div>${opt.text}</div>
        `;
        optionsContainer.appendChild(card);
      });

      // 控制按鈕狀態
      document.getElementById('btn-prev').style.visibility = (currentQuestionIndex === 0) ? 'hidden' : 'visible';
      document.getElementById('btn-next').innerText = (currentQuestionIndex === total - 1) ? '提交卷軸' : '下一題';
    }

    function selectOption(qId, key) {
      userAnswers[qId] = key;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIndex < currentQuizData.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
      } else {
        submitQuiz();
      }
    }

    // 提交測驗至 GAS
    async function submitQuiz() {
      alert('正在批改並計算診斷報告，請稍候...');

      const payload = {
        quiz_id: userInfo.quizId,
        user_id: userInfo.userId,
        user_name: userInfo.userName,
        user_email: userInfo.email,
        answers: userAnswers
      };

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
          // 渲染分數與稱號
          document.getElementById('result-score').innerText = result.score;
          document.getElementById('result-badge').innerText = getBadgeTitle(result.score);

          // 繪製雷達圖
          drawRadarChart(result.userTagAccuracy);
          showView('view-result');
        } else {
          alert('提交失敗：' + result.message);
        }
      } catch (e) {
        alert('網路傳輸失敗！');
      }
    }

    // 得分稱號比對
    function getBadgeTitle(score) {
      if (score === 100) return '【獨孤求敗・國文大宗師】';
      if (score >= 80) return '【翰林學士・妙筆生花】';
      if (score >= 60) return '【江湖浪子・瀟灑隱士】';
      return '【潛心修鍊・再接再厲】';
    }

    // 繪製 Chart.js 雷達圖
    function drawRadarChart(userTagAccuracy) {
      const labels = Object.keys(userTagAccuracy);
      const dataValues = Object.values(userTagAccuracy);

      // 智慧分析文字
      let minScore = 100;
      let weakTag = '';
      labels.forEach(tag => {
        if (userTagAccuracy[tag] < minScore) {
          minScore = userTagAccuracy[tag];
          weakTag = tag;
        }
      });

      const insightEl = document.getElementById('ai-insight');
      if (minScore < 100 && weakTag) {
        insightEl.innerHTML = `<strong>💡 學習建議：</strong>你在「<strong>${weakTag}</strong>」掌握度較低（${minScore}%），詳細錯題與解析已寄送至你的 Email，請優先複習此單元！`;
      } else {
        insightEl.innerHTML = `<strong>🎉 表現優異：</strong>你在各個領域表現均十分出色，請繼續保持！`;
      }

      const ctx = document.getElementById('radarChart').getContext('2d');
      if (radarChartInstance) radarChartInstance.destroy();

      radarChartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: labels,
          datasets: [{
            label: '掌握度 (%)',
            data: dataValues,
            backgroundColor: 'rgba(201, 42, 42, 0.2)',
            borderColor: '#c92a2a',
            borderWidth: 2,
            pointBackgroundColor: '#c92a2a'
          }]
        },
        options: {
          responsive: true,
          scales: {
            r: {
              min: 0, max: 100,
              ticks: { display: false },
              pointLabels: { font: { size: 12, weight: 'bold' } }
            }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    // 查詢歷史紀錄
    async function fetchHistory() {
      const className = document.getElementById('input-class').value;
      const seat = document.getElementById('input-seat').value;

      if (!seat) {
        alert('請先輸入座號以查詢紀錄！');
        return;
      }

      const userId = `${className}_${seat}`;
      const listEl = document.getElementById('history-list');
      listEl.innerHTML = '正在查詢歷次紀錄...';
      showView('view-history');

      try {
        const response = await fetch(`${GAS_API_URL}?action=getStudentHistory&user_id=${userId}`);
        const result = await response.json();

        if (result.status === 'success' && result.data.length > 0) {
          listEl.innerHTML = '';
          result.data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
              <div>
                <strong>${item.quizId}</strong><br>
                <small style="color: #888;">${item.timestamp}</small>
              </div>
              <div style="font-size: 18px; font-weight: bold; color: var(--primary-color);">
                ${item.score} 分
              </div>
            `;
            listEl.appendChild(div);
          });
        } else {
          listEl.innerHTML = '<p>查無過去的測驗紀錄。</p>';
        }
      } catch (e) {
        listEl.innerHTML = '<p>查詢失敗，請稍後再試。</p>';
      }
    }
  </script>
</body>
</html>
